<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="movie-arch-bg" x1="120" y1="100" x2="1100" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="movie-arch-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="movie-arch-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#movie-arch-bg)"/>
  <circle cx="1060" cy="136" r="180" fill="#FB923C" fill-opacity="0.12"/>
  <circle cx="132" cy="594" r="200" fill="#FBBF24" fill-opacity="0.12"/>

  <text x="84" y="98" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">MovieApp Architecture</text>
  <text x="84" y="132" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="20">Vue.js · Django REST Framework · TMDB API</text>

  <g filter="url(#movie-arch-shadow)">
    <rect x="84" y="210" width="286" height="144" rx="28" fill="#111827" stroke="#FBBF24" stroke-width="2"/>
    <text x="116" y="258" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Frontend</text>
    <text x="116" y="296" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Vue.js</text>
    <text x="116" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">MovieView · MovieDetail · MyPageView</text>
  </g>

  <g filter="url(#movie-arch-shadow)">
    <rect x="456" y="210" width="286" height="144" rx="28" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="488" y="258" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Backend</text>
    <text x="488" y="296" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Django REST</text>
    <text x="488" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">accounts · community · movies</text>
  </g>

  <g filter="url(#movie-arch-shadow)">
    <rect x="828" y="210" width="286" height="144" rx="28" fill="#111827" stroke="#FB923C" stroke-width="2"/>
    <text x="860" y="258" fill="#FED7AA" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">External Data</text>
    <text x="860" y="296" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">TMDB API</text>
    <text x="860" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">poster · genre · release metadata</text>
  </g>

  <g filter="url(#movie-arch-shadow)">
    <rect x="188" y="438" width="356" height="166" rx="28" fill="#1C1917" stroke="#FBBF24" stroke-width="2"/>
    <text x="220" y="486" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">User Content Flow</text>
    <text x="220" y="526" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">좋아요 · 한줄평 · 나중에 볼</text>
    <text x="220" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">마이페이지에서 사용자 흔적을 한 화면에 통합</text>
  </g>

  <g filter="url(#movie-arch-shadow)">
    <rect x="620" y="438" width="396" height="166" rx="28" fill="#1C1917" stroke="#FB923C" stroke-width="2"/>
    <text x="652" y="486" fill="#FED7AA" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Recommendation Layer</text>
    <text x="652" y="526" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">추천 콘텐츠 큐</text>
    <text x="652" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">영화 메타데이터 위에 사용자 반응 신호를 얹어 피드 구성</text>
  </g>

  <path d="M370 282H456" stroke="url(#movie-arch-accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M742 282H828" stroke="url(#movie-arch-accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M600 354V438" stroke="url(#movie-arch-accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M544 522H620" stroke="url(#movie-arch-accent)" stroke-width="8" stroke-linecap="round"/>
</svg>
