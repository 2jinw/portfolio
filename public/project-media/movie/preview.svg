<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="movie-bg" x1="120" y1="100" x2="1080" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#3F1D0F"/>
    </linearGradient>
    <linearGradient id="movie-poster-a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="movie-poster-b" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="movie-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#movie-bg)"/>
  <circle cx="180" cy="130" r="140" fill="#F59E0B" fill-opacity="0.18"/>
  <circle cx="1060" cy="620" r="220" fill="#FB923C" fill-opacity="0.12"/>

  <text x="84" y="98" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">MovieApp</text>
  <text x="84" y="132" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="20">영화 추천 · 한줄평 · 나중에 볼 · 마이페이지</text>

  <g filter="url(#movie-shadow)">
    <rect x="84" y="182" width="612" height="420" rx="28" fill="#111827" stroke="#FBBF24" stroke-width="2"/>
    <rect x="84" y="182" width="612" height="72" rx="28" fill="#1F2937"/>
    <text x="118" y="228" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">추천 피드</text>

    <rect x="118" y="286" width="152" height="228" rx="22" fill="url(#movie-poster-a)"/>
    <rect x="294" y="286" width="152" height="228" rx="22" fill="url(#movie-poster-b)"/>
    <rect x="470" y="286" width="192" height="108" rx="22" fill="#1F2937"/>
    <rect x="470" y="406" width="192" height="108" rx="22" fill="#1F2937"/>

    <text x="490" y="442" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">한줄평</text>
    <text x="490" y="472" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="16">좋아요와 리뷰 흔적을 함께 반영</text>
    <text x="490" y="518" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">나중에 볼</text>
    <text x="490" y="548" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="16">저장한 영화 큐를 마이페이지와 연동</text>
  </g>

  <g filter="url(#movie-shadow)">
    <rect x="754" y="212" width="280" height="390" rx="30" fill="#FEF3C7" fill-opacity="0.95" stroke="#F59E0B" stroke-width="2"/>
    <text x="790" y="268" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">My Page</text>
    <circle cx="894" cy="334" r="48" fill="#FCD34D"/>
    <rect x="806" y="406" width="176" height="20" rx="10" fill="#F59E0B" fill-opacity="0.35"/>
    <rect x="806" y="444" width="176" height="20" rx="10" fill="#F59E0B" fill-opacity="0.22"/>
    <rect x="806" y="498" width="176" height="76" rx="18" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="826" y="530" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">좋아요 / 한줄평 / 저장</text>
    <text x="826" y="558" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="16">한 화면에서 확인하는 사용자 기록</text>
  </g>
</svg>
