<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="imo-bg" x1="120" y1="80" x2="1100" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082F49"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="imo-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="imo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#imo-bg)"/>
  <circle cx="1044" cy="124" r="180" fill="#22D3EE" fill-opacity="0.1"/>
  <circle cx="120" cy="604" r="220" fill="#3B82F6" fill-opacity="0.12"/>

  <text x="84" y="98" fill="#E0F2FE" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">IMO</text>
  <text x="84" y="132" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="20">smart-glass workout coach · Flutter app · Pi handshake · Redis + Gemini</text>

  <g filter="url(#imo-shadow)">
    <rect x="84" y="196" width="226" height="128" rx="26" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="116" y="244" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Wearable Layer</text>
    <text x="116" y="282" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Smart Glass</text>
    <text x="116" y="308" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">pose capture</text>
  </g>

  <g filter="url(#imo-shadow)">
    <rect x="362" y="196" width="226" height="128" rx="26" fill="#0F172A" stroke="#67E8F9" stroke-width="2"/>
    <text x="394" y="244" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Device Bridge</text>
    <text x="394" y="282" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Raspberry Pi</text>
    <text x="394" y="308" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">workout state · protocol</text>
  </g>

  <g filter="url(#imo-shadow)">
    <rect x="640" y="196" width="226" height="128" rx="26" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
    <text x="672" y="244" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Backend Layer</text>
    <text x="672" y="282" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Spring + Django</text>
    <text x="672" y="308" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">sessions · statistics · chat</text>
  </g>

  <g filter="url(#imo-shadow)">
    <rect x="918" y="196" width="198" height="128" rx="26" fill="#0F172A" stroke="#93C5FD" stroke-width="2"/>
    <text x="950" y="244" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">App Layer</text>
    <text x="950" y="282" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Flutter</text>
    <text x="950" y="308" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">coach UI · charts</text>
  </g>

  <g filter="url(#imo-shadow)">
    <rect x="170" y="426" width="350" height="170" rx="28" fill="#082F49" stroke="#38BDF8" stroke-width="2"/>
    <text x="202" y="474" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Key Fix</text>
    <text x="202" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">App ↔ Pi Start Handshake</text>
    <text x="202" y="550" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">사용자가 “운동 시작”을 눌러야 monitoring 진입</text>
    <text x="202" y="580" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">오염 데이터와 우발 트리거를 줄인 핵심 변경</text>
  </g>

  <g filter="url(#imo-shadow)">
    <rect x="620" y="426" width="394" height="170" rx="28" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
    <text x="652" y="474" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Shared State</text>
    <text x="652" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Redis + Gemini</text>
    <text x="652" y="550" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Redis: 세션 상태 / 캐시 공유</text>
    <text x="652" y="580" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Gemini: 운동 챗봇과 코치 응답 확장</text>
  </g>

  <path d="M310 260H362" stroke="url(#imo-accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M588 260H640" stroke="url(#imo-accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M866 260H918" stroke="url(#imo-accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M753 324V426" stroke="url(#imo-accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M520 512H620" stroke="url(#imo-accent)" stroke-width="8" stroke-linecap="round"/>
</svg>
