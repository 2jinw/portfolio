name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci 대신 install 사용: Windows에서 생성된 lock 파일에 Linux용 optional
      # 네이티브 패키지(@emnapi/* 등)가 누락돼 있어 ci(엄격 검증)는 실패하기 때문.
      - run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: /portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
